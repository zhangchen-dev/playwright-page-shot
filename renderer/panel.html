<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src 'self' file: http: https:;">
  <title>场景录制助手</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/recording.css">
  <link rel="stylesheet" href="styles/management.css">
  <link rel="stylesheet" href="styles/settings.css">
</head>
<body>
  <div id="layout">
    <!-- ① 左侧菜单栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-logo">🎬</div>
      <div class="menu-item active" data-view="recording">
        <span class="menu-icon">🎥</span>
        <span class="menu-text">页面录制</span>
      </div>
      <div class="menu-item" data-view="management">
        <span class="menu-icon">🗂️</span>
        <span class="menu-text">场景管理</span>
      </div>
      <div class="menu-item" data-view="demo">
        <span class="menu-icon">🎨</span>
        <span class="menu-text">定制演示</span>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="menu-item" data-view="settings">
        <span class="menu-icon">⚙️</span>
        <span class="menu-text">设置</span>
      </div>
    </aside>

    <!-- ② 中间列 -->
    <main id="mainColumn" class="main-column">
      <div class="middle-header">
        <span class="middle-title" id="middleTitle">页面录制</span>
      </div>
      <div class="url-bar" id="urlBar">
        <label class="url-label" for="urlInput">输入页面url</label>
        <input type="text" id="urlInput" placeholder="https://..." class="url-input">
        <button id="navigateBtn" class="url-go-btn">→</button>
      </div>
      <div id="content" class="content-area"></div>
      <div id="statusBar" class="status-bar"></div>
    </main>

    <!-- 列分界线（展开/收起中间列） -->
    <div id="columnDivider" class="column-divider">
      <button id="dividerToggleBtn" class="divider-toggle-btn" title="展开/收起中间列">◀</button>
    </div>

    <!-- ③ 右侧可折叠列 -->
    <aside id="rightColumn" class="right-column collapsed">
      <div class="right-toolbar">
        <span class="right-title" id="rightTitle">录制记录</span>
        <div class="right-toolbar-actions" id="rightToolbarActions" style="display:none;">
          <select class="resolution-select" id="resolutionSelect" title="页面尺寸">
            <option value="1920">🖥️ 1920×1080</option>
            <option value="1366">💻 1366×768</option>
          </select>
          <!-- ★ 移动端录制/预览开关：开启后 webview 以移动端视口 + 移动 UA + 触摸模拟展示 -->
          <label class="mobile-mode-control" id="mobileModeControl" title="移动端预览/录制（固定移动端视口 + 移动 UA）">
            <span class="mobile-mode-label">📱 移动端</span>
            <label class="switch-toggle">
              <input type="checkbox" id="mobileModeSwitch">
              <span class="switch-slider"></span>
            </label>
          </label>
          <button class="fit-page-btn" id="fitPageBtn" title="适配页面（按比例缩放到容器）">📐 适配</button>
          <select class="zoom-select" id="zoomSelect" title="缩放比例">
            <option value="1.0">100%</option>
            <option value="0.9">90%</option>
            <option value="0.8">80%</option>
            <option value="0.75">75%</option>
            <option value="0.6">60%</option>
            <option value="0.5">50%</option>
          </select>
          <button class="fullscreen-btn" id="fullscreenBtn" title="全屏预览（ESC 退出）">⛶ 全屏</button>
        </div>
        <!-- ★ 收起/展开控件按钮（始终可见，用于切换预览控件显隐） -->
        <button class="collapse-controls-btn" id="collapseControlsBtn" title="收起预览控件">▲ 收起</button>
        <button id="closeRightBtn" class="right-close-btn">✕</button>
      </div>
      <!-- 步骤列表容器（录制视图） -->
      <div id="rightContent" class="right-content"></div>
      <!-- webview 预览/浏览器容器 -->
      <div id="previewContainer" class="preview-container">
        <!-- ★ 收起态下悬浮于顶部的「展开控件」按钮（鼠标移至预览区顶部时出现） -->
        <div class="preview-floating-bar" id="previewFloatingBar">
          <button class="preview-expand-btn" id="previewExpandBtn" title="展开预览控件">▾ 展开控件</button>
        </div>
        <div class="preview-loading" id="previewLoading">加载中...</div>
        <!-- ★ Banner 轮播区域（录制视图未开浏览器时显示） -->
        <div id="bannerContainer" class="banner-container" style="display:none;"></div>
        <!-- ★ Tab 栏（多 webview 切换；target=_blank 拦截后追加 tab） -->
        <div id="tabBar" class="tab-bar"></div>
        <!-- ★ Tab 页面容器：每个 tab 一个 <webview>，display 切换显隐 -->
        <div id="tabPages" class="tab-pages">
          <!-- 主 tab：保留原录制/缩放逻辑的 #previewWebview -->
          <div class="webview-tab-page active" data-tab-id="main">
            <div class="webview-scroll-wrapper" id="webviewScrollWrapper">
              <div class="webview-scale-wrapper" id="webviewScaleWrapper">
                <!-- ★ allowpopups 必须是独立布尔属性（Electron: disablePopups = !allowpopups）。
                     写成 webpreferences="allowpopups" 无效 —— Chromium 会在渲染层直接吞掉
                     target=_blank / window.open，主进程 setWindowOpenHandler 永远不触发，
                     表现就是"点击没反应"。 -->
                <webview id="previewWebview" class="preview-webview-inner" partition="persist:webview" allowpopups></webview>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast 通知容器 -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="modules/app.js"></script>
</body>
</html>
